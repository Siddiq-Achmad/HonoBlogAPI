<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0" />
      <stop offset="50%" stop-color="#F2E9DC" />
      <stop offset="100%" stop-color="#E8DCB8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880" />
      <stop offset="50%" stop-color="#A88857" />
      <stop offset="100%" stop-color="#87693B" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A88857" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#87693B" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="60" cy="60" r="54" fill="url(#halo)" />

  <!-- Stylized Elegant Portrait Silhouette -->
  <g filter="url(#shadow)" fill="url(#goldGrad)">
    <!-- Head -->
    <circle cx="60" cy="46" r="18" />
    <!-- Neck & Shoulders -->
    <path d="M60 67 C42 67, 28 78, 26 95 C28 97, 34 100, 60 100 C86 100, 92 97, 94 95 C92 78, 78 67, 60 67 Z" />
  </g>

  <!-- LUXIMA Gold Laurel Ring Accent -->
  <circle cx="60" cy="60" r="57" fill="none" stroke="#A88857" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
</svg>